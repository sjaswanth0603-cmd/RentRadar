<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        RentRadar - AI Rental Intelligence & Price Prediction
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>"
    >

    {% block head %}{% endblock %}

</head>


<body>


<header class="topbar">

    <h1>
        RentRadar
    </h1>

</header>


<div class="layout">


    <!-- =================================================
         SIDEBAR NAVIGATION
    ================================================= -->

    <nav class="sidebar">

        <ul>


            <!-- DATA LOADING -->

            <li>

                <a
                    href="{{ url_for('data_loading') }}"
                    class="menu-item {% if active == 'data-loading' %}active{% endif %}"
                >
                    Data Loading
                </a>

            </li>


            <!-- EDA -->

            <li>

                <a
                    href="{{ url_for('eda') }}"
                    class="menu-item {% if active == 'eda' %}active{% endif %}"
                >
                    EDA
                </a>

            </li>


            <!-- PREPROCESSING -->

            <li>

                <a
                    href="{{ url_for('preprocessing') }}"
                    class="menu-item {% if active == 'preprocessing' %}active{% endif %}"
                >
                    Preprocessing
                </a>

            </li>


            <!-- LINEAR REGRESSION -->

            <li>

                <a
                    href="{{ url_for('linear_regression') }}"
                    class="menu-item {% if active == 'linear-regression' %}active{% endif %}"
                >
                    Linear Regression
                </a>

            </li>


            <!-- LOGISTIC REGRESSION -->

            <li>

                <a
                    href="{{ url_for('logistic_regression') }}"
                    class="menu-item {% if active == 'logistic-regression' %}active{% endif %}"
                >
                    Logistic Regression
                </a>

            </li>


            <!-- DECISION TREES -->

            <li>

                <a
                    href="{{ url_for('decision_trees') }}"
                    class="menu-item {% if active == 'decision-trees' %}active{% endif %}"
                >
                    Decision Trees
                </a>

            </li>


            <!-- =================================================
                 NEW K-MEANS OPTION
            ================================================= -->

            <li>

                <a
                    href="{{ url_for('kmeans') }}"
                    class="menu-item {% if active == 'kmeans' %}active{% endif %}"
                >
                    K-Means
                </a>

            </li>


            <!-- RENT PREDICTOR -->

            <li>

                <a
                    href="{{ url_for('predictor') }}"
                    class="menu-item {% if active == 'predictor' %}active{% endif %}"
                >
                    Rent Predictor
                </a>

            </li>


        </ul>

    </nav>


    <!-- =================================================
         MAIN CONTENT
    ================================================= -->

    <main class="content">

        {% block content %}{% endblock %}

    </main>


</div>


{% block scripts %}{% endblock %}


</body>

</html>
